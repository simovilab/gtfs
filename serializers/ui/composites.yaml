# yaml-language-server: $schema=./composites.schema.json

# ---------------------------------------------------------------
# SIMOVI — display composites (companion file)
# ---------------------------------------------------------------
# This file is NOT part of the GTFS specification and nothing in the spec
# implies it. It is SIMOVI's own presentation layer: which GTFS Schedule and
# GTFS Realtime fields each screen reads, in what order, and what happens when
# they are missing.
#
# It is the transpose of serializers/schedule/schedule.ui.yaml:
#
#   schedule.ui.yaml  "how does someone EDIT this field?"     one entry per field
#   composites.yaml   "which fields does this SCREEN read?"   one entry, many fields
#
# A composite is assembled from the same pieces a UI component is:
#
#   params  the identifiers you pass in to instantiate it (routes.route_id).
#           These are join keys, not decoration. Each one is backed by an
#           editor component in schedule.ui.yaml — usually id_input.
#   props   the attributes it draws (a stop name, a fare, an ETA). By default
#           a prop's `sources` is an ORDERED FALLBACK CHAIN: first non-empty
#           source wins. That chain is the realtime-to-static degradation
#           policy, written down once instead of reimplemented per screen.
#           `mode: all` marks the exception — sources that are one value
#           together, like a lat/lon pair, rather than alternatives.
#
# A prop may name another composite instead of sources, which is how the small
# pieces are reused rather than restated.
#
# Source references are prefixed by where the value comes from:
#
#   schedule:<file>.<field>          flat, as GTFS CSV is flat
#   realtime:<Message>.<field>...    a path walked through the protobuf messages
#   derived:<name>                   an artifact the app builds from the feed,
#                                    declared under `derived_sources` below
#
# Contents follow the route view proposed in the lab session of 2026-09-10.
#
# See documentation/composites.md for the vocabulary and the reasoning.

version: 1

# Things the app serves that are not fields in the feed. Declaring what each
# one is built from keeps them checkable: if shapes.txt loses a field, the
# GeoJSON that depends on it breaks the build like any other reference.
derived_sources:

  shapes.geojson:
    i18n:
      es: {label: 'Trazado en GeoJSON'}
      en: {label: 'Alignment as GeoJSON'}
      pt: {label: 'Traçado em GeoJSON'}
    from:
      - schedule:shapes.shape_id
      - schedule:shapes.shape_pt_lat
      - schedule:shapes.shape_pt_lon
      - schedule:shapes.shape_pt_sequence
    note: 'shapes.txt -> shapes.geojson. The map consumes GeoJSON; nothing on screen reads the CSV rows directly.'

composites:

  # --------------------------- RouteHeader ---------------------------
  # Provisional: the top of the proposal sheet was cut off, so this block is
  # the one piece here not transcribed from it.

  RouteHeader:
    entity: route
    cardinality: one
    i18n:
      es:
        label: 'Encabezado de ruta'
        help: 'Bloque superior de la pantalla de una ruta: cómo se llama, quién la opera y de qué modo es.'
      en:
        label: 'Route header'
        help: 'Top block of a route screen: what it is called, who operates it, and what mode it is.'
      pt:
        label: 'Cabeçalho da rota'
        help: 'Bloco superior da tela de uma rota: como se chama, quem opera e qual o modo.'
    notes:
      - 'Provisional. Confirm against the top of the proposal sheet, which the photo cuts off.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
    props:
      - name: code
        required: true
        # route_short_name is Conditionally Required: a feed may carry only the
        # long name. Falling back keeps the header renderable for such feeds.
        sources:
          - schedule:routes.route_short_name
          - schedule:routes.route_long_name
        i18n:
          es: {label: 'Código'}
          en: {label: 'Code'}
          pt: {label: 'Código'}
      - name: title
        required: true
        sources:
          - schedule:routes.route_long_name
          - schedule:routes.route_short_name
        note: 'Reverse of `code` on purpose: the badge wants the short form, the heading wants the descriptive one.'
        i18n:
          es: {label: 'Nombre'}
          en: {label: 'Name'}
          pt: {label: 'Nome'}
      - name: description
        sources:
          - schedule:routes.route_desc
      - name: mode
        required: true
        sources:
          - schedule:routes.route_type
        compute: 'Enum value rendered as an icon plus its label; option list comes from schedule.yaml.'
      - name: colors
        mode: all
        sources:
          - schedule:routes.route_color
          - schedule:routes.route_text_color
        note: 'One pair, not alternatives. Contrast between them is a warning-level rule in schedule.ui.yaml.'
      - name: operator
        sources:
          - schedule:agency.agency_name
        compute: 'Joined via routes.agency_id; Conditionally Required when the feed has one agency.'

  # -------------------------- RouteNextTrips -------------------------

  RouteNextTrips:
    entity: trip
    cardinality: many
    i18n:
      es:
        label: 'Próximos viajes'
        help: 'Próximas salidas de la ruta. Usa tiempo real cuando existe y horario programado cuando no.'
      en:
        label: 'Next trips'
        help: 'The route upcoming departures. Uses realtime when available and the scheduled timetable when not.'
      pt:
        label: 'Próximas viagens'
        help: 'Próximas partidas da rota. Usa tempo real quando existe e o horário programado quando não.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
      - name: stop_id
        source: schedule:stops.stop_id
        required: false
        note: 'Optional: given a stop, the list narrows to departures from it.'
    key: schedule:trips.trip_id
    props:
      - name: destination
        required: true
        sources:
          - realtime:TripUpdate.trip_properties.trip_headsign
          - schedule:trips.trip_headsign
          - schedule:stop_times.stop_headsign
          - schedule:routes.route_long_name
        note: 'Four levels deep because a headsign is the one thing riders use to tell two directions apart; showing nothing is not an option.'
        i18n:
          es: {label: 'Destino'}
          en: {label: 'Destination'}
          pt: {label: 'Destino'}
      - name: eta
        required: true
        sources:
          - realtime:TripUpdate.stop_time_update.departure.time
          - realtime:TripUpdate.stop_time_update.arrival.time
          - schedule:stop_times.departure_time
          - schedule:stop_times.arrival_time
        freshness: 60s
        compute: 'Minutes remaining = source time minus FeedHeader.timestamp, not the device clock.'
        i18n:
          es: {label: 'Llegada'}
          en: {label: 'Arrival'}
          pt: {label: 'Chegada'}
      - name: eta_is_live
        sources:
          - realtime:FeedHeader.timestamp
        compute: 'True when `eta` resolved to a realtime source. Drives the live indicator; must never be shown for a scheduled time.'
      - name: delay
        sources:
          - realtime:TripUpdate.stop_time_update.departure.delay
          - realtime:TripUpdate.delay
        freshness: 60s
      - name: occupancy
        sources:
          - realtime:VehiclePosition.occupancy_status
          - realtime:TripUpdate.stop_time_update.departure_occupancy_status
        freshness: 90s

  # --------------------------- RouteSchedule -------------------------
  # From the proposal: "reemplazo de la tabla de horarios de uso comun",
  # marked provisional there. Start times, split by direction.

  RouteSchedule:
    entity: trip
    cardinality: many
    i18n:
      es:
        label: 'Horario de la ruta'
        help: 'Horas de salida de la ruta, separadas por sentido. Reemplaza la tabla de horarios de uso común.'
      en:
        label: 'Route schedule'
        help: 'The route departure times, split by direction. Replaces the commonly used timetable table.'
      pt:
        label: 'Horário da rota'
        help: 'Horários de partida da rota, separados por sentido. Substitui a tabela de horários de uso comum.'
    notes:
      - 'Marked provisional in the proposal: the grouping is settled, the presentation is not.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
    key: schedule:trips.trip_id
    props:
      - name: direction
        required: true
        sources:
          - schedule:trips.direction_id
        compute: 'Groups the whole block: one column, tab or section per direction.'
        i18n:
          es: {label: 'Sentido'}
          en: {label: 'Direction'}
          pt: {label: 'Sentido'}
      - name: trip_start_time
        required: true
        sources:
          - schedule:frequencies.start_time
          - schedule:stop_times.departure_time
        compute: 'For a frequency-based trip, frequencies.start_time. Otherwise the departure_time of the trip first stop_time, by stop_sequence.'
        i18n:
          es: {label: 'Hora de salida'}
          en: {label: 'Start time'}
          pt: {label: 'Hora de partida'}
      - name: headway
        sources:
          - schedule:frequencies.headway_secs
        note: 'Only frequency-based trips have one; a scheduled trip shows its start time instead.'
      - name: service_days
        sources:
          - schedule:trips.service_id
        compute: 'Resolved through calendar.txt and calendar_dates.txt into the days the trip runs.'

  # ---------------------------- RouteStops ---------------------------
  # Named "RouteStops (RouteStopsSchedule)" in the proposal.

  RouteStops:
    entity: stop
    cardinality: many
    i18n:
      es:
        label: 'Paradas de la ruta'
        help: 'Lista ordenada de las paradas por las que pasa la ruta.'
      en:
        label: 'Route stops'
        help: 'Ordered list of the stops the route serves.'
      pt:
        label: 'Paradas da rota'
        help: 'Lista ordenada das paradas atendidas pela rota.'
    notes:
      - 'Also written RouteStopsSchedule in the proposal, where it doubles as the per-stop timetable.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
    key: schedule:stops.stop_id
    props:
      - name: order
        required: true
        sources:
          - schedule:stop_times.stop_sequence
        compute: 'Orders the list. Not drawn on its own.'
      - name: stop_code
        sources:
          - schedule:stops.stop_code
        note: 'The number riders see on the sign and quote to the driver, distinct from stop_id.'
        i18n:
          es: {label: 'Código'}
          en: {label: 'Code'}
          pt: {label: 'Código'}
      - name: stop_name
        required: true
        sources:
          - schedule:stops.stop_name
        i18n:
          es: {label: 'Parada'}
          en: {label: 'Stop'}
          pt: {label: 'Parada'}
      - name: stop_desc
        sources:
          - schedule:stops.stop_desc
        note: 'Drawn as the secondary line under stop_name, and reused as the map popup text.'
      - name: accessible
        sources:
          - schedule:stops.wheelchair_boarding

  # ---------------------------- RouteMap -----------------------------

  RouteMap:
    entity: route
    cardinality: one
    i18n:
      es:
        label: 'Mapa de la ruta'
        help: 'Trazado de la ruta y sus paradas sobre el mapa.'
      en:
        label: 'Route map'
        help: 'The route alignment and its stops on the map.'
      pt:
        label: 'Mapa da rota'
        help: 'Traçado da rota e suas paradas sobre o mapa.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
    props:
      - name: alignment
        sources:
          - derived:shapes.geojson
        note: 'Absent shapes.txt, the alignment degrades to a straight line between consecutive stops.'
        i18n:
          es: {label: 'Trazado'}
          en: {label: 'Alignment'}
          pt: {label: 'Traçado'}
      - name: stop_pins
        required: true
        mode: all
        sources:
          - schedule:stops.stop_lat
          - schedule:stops.stop_lon
        compute: 'One pin per stop in RouteStops, reached through stop_times.stop_id.'
        note: 'One coordinate, two fields — not a fallback chain.'
        i18n:
          es: {label: 'Paradas'}
          en: {label: 'Stops'}
          pt: {label: 'Paradas'}
      - name: pin_popup
        composite: RouteStops
        note: 'The popup is the RouteStops row for that pin: code, name and stop_desc.'
      - name: vehicles
        mode: all
        sources:
          - realtime:VehiclePosition.position.latitude
          - realtime:VehiclePosition.position.longitude
        freshness: 90s
        note: 'Absent realtime, the layer is hidden rather than shown empty — a stale vehicle is worse than no vehicle.'
      - name: vehicle_bearing
        sources:
          - realtime:VehiclePosition.position.bearing
        freshness: 90s

  # ---------------------------- RouteFares ---------------------------
  # The proposal is explicit that this is GTFS-Fares v2, not fare_attributes.

  RouteFares:
    entity: fare
    cardinality: many
    i18n:
      es:
        label: 'Tarifas de la ruta'
        help: 'Qué cuesta viajar en la ruta, por categoría de persona usuaria y medio de pago. Usa GTFS-Fares v2.'
      en:
        label: 'Route fares'
        help: 'What it costs to ride the route, by rider category and fare media. Uses GTFS-Fares v2.'
      pt:
        label: 'Tarifas da rota'
        help: 'Quanto custa viajar na rota, por categoria de passageiro e meio de pagamento. Usa GTFS-Fares v2.'
    notes:
      - 'Fares v2, on purpose: fare_attributes.txt/fare_rules.txt cannot express rider categories or fare media.'
      - 'A fare calculator was raised in the proposal and is out of scope here; this block only displays the applicable products.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
    key: schedule:fare_products.fare_product_id
    props:
      - name: network
        required: true
        sources:
          - schedule:route_networks.network_id
          - schedule:routes.network_id
        compute: 'The join from a route to its fares: route -> network -> fare_leg_rules -> fare_products.'
      - name: product_name
        required: true
        sources:
          - schedule:fare_products.fare_product_name
        i18n:
          es: {label: 'Tarifa'}
          en: {label: 'Fare'}
          pt: {label: 'Tarifa'}
      - name: amount
        required: true
        mode: all
        sources:
          - schedule:fare_products.amount
          - schedule:fare_products.currency
        note: 'Amount and currency are one value; currency also sets the decimal precision.'
        i18n:
          es: {label: 'Monto'}
          en: {label: 'Amount'}
          pt: {label: 'Valor'}
      - name: rider_category
        sources:
          - schedule:rider_categories.rider_category_name
        compute: 'Joined via fare_products.rider_category_id. Absent, the product applies to every rider.'
        i18n:
          es: {label: 'Categoría'}
          en: {label: 'Rider category'}
          pt: {label: 'Categoria'}
      - name: fare_media
        sources:
          - schedule:fare_media.fare_media_name
        compute: 'Joined via fare_products.fare_media_id — cash, card, app.'
      - name: eligibility
        sources:
          - schedule:rider_categories.eligibility_url
        note: 'Where a rider goes to prove they qualify for a discounted category.'

  # ---------------------------- RouteAlerts --------------------------

  RouteAlerts:
    entity: alert
    cardinality: many
    i18n:
      es:
        label: 'Alertas de la ruta'
        help: 'Avisos de servicio vigentes que afectan a la ruta: desvíos, suspensiones, cambios de parada.'
      en:
        label: 'Route alerts'
        help: 'Active service notices affecting the route: detours, suspensions, stop changes.'
      pt:
        label: 'Alertas da rota'
        help: 'Avisos de serviço vigentes que afetam a rota: desvios, suspensões, mudanças de parada.'
    params:
      - name: route_id
        source: schedule:routes.route_id
        required: true
    key: realtime:FeedEntity.id
    props:
      - name: applies_to
        required: true
        sources:
          - realtime:Alert.informed_entity.route_id
        compute: 'Selects the alerts for this route. An alert naming only an agency or a stop is matched separately.'
      - name: headline
        required: true
        sources:
          - realtime:Alert.header_text.translation.text
        note: 'Required and realtime-only: absent a realtime feed the whole block is hidden, which is correct — no feed means no known alerts, not "no alerts".'
        i18n:
          es: {label: 'Aviso'}
          en: {label: 'Headline'}
          pt: {label: 'Aviso'}
      - name: detail
        sources:
          - realtime:Alert.description_text.translation.text
      - name: severity
        sources:
          - realtime:Alert.severity_level
        compute: 'Drives the visual weight of the block. Absent, treat as UNKNOWN_SEVERITY and do not escalate.'
      - name: reason
        mode: all
        sources:
          - realtime:Alert.cause
          - realtime:Alert.effect
        note: 'Cause and effect are read together — "construction" alone does not tell a rider what happens to their trip.'
      - name: active_period
        mode: all
        sources:
          - realtime:Alert.active_period.start
          - realtime:Alert.active_period.end
        compute: 'An absent end means open-ended; an absent start means already in effect.'
      - name: more_info
        sources:
          - realtime:Alert.url.translation.text

views:

  routes_detail:
    path: '/routes/:route_id'
    i18n:
      es: {label: 'Detalle de ruta'}
      en: {label: 'Route detail'}
      pt: {label: 'Detalhe da rota'}
    blocks:
      - RouteHeader
      - RouteNextTrips
      - RouteSchedule
      - RouteStops
      - RouteMap
      - RouteFares
      - RouteAlerts
    notes:
      - 'Block order follows the proposal sheet of 2026-09-10, top to bottom.'
