name: Build UI explorer & deploy to Pages

on:
  push:
    branches: [main]
    paths:
      - 'serializers/schedule/**'
      - 'serializers/realtime/**'
      - 'serializers/ui/**'
      - 'converters/schedule/**'
      - 'converters/realtime/**'
      - 'converters/site/**'
      - 'converters/ui/**'
      - '.github/workflows/schedule-ui-site.yml'
  pull_request:
    paths:
      - 'serializers/schedule/**'
      - 'serializers/realtime/**'
      - 'serializers/ui/**'
      - 'converters/schedule/**'
      - 'converters/realtime/**'
      - 'converters/site/**'
      - 'converters/ui/**'
      - '.github/workflows/schedule-ui-site.yml'
  schedule:
    # Weekly, so drift between schedule.yaml and schedule.ui.yaml surfaces
    # even when nobody has pushed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-ui-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Regenerate schedule.json from schedule.yaml
        run: uv run converters/schedule/yaml2json.py

      - name: Report annotation coverage
        id: coverage
        run: |
          # Without pipefail the exit status would be tee's, so an orphaned
          # annotation or a dangling cross-feed reference would pass the build.
          set -o pipefail
          uv run converters/schedule/ui_coverage.py | tee coverage.txt
          uv run converters/schedule/ui_coverage.py --json > coverage.json
          uv run converters/realtime/ui_coverage.py | tee coverage-realtime.txt
          uv run converters/realtime/ui_coverage.py --json > coverage-realtime.json
          {
            echo "### Editor annotation coverage"
            echo
            echo '```'
            cat coverage.txt
            echo
            cat coverage-realtime.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check display composites
        id: composites
        run: |
          # Without pipefail the exit status would be tee's, and a dangling
          # field reference would pass the build.
          set -o pipefail
          uv run converters/ui/composites.py | tee composites.txt
          {
            echo "### Display composites"
            echo
            echo '```'
            cat composites.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the Schedule explorer
        run: uv run converters/schedule/yaml2site.py

      - name: Build the Realtime explorer
        run: uv run converters/realtime/realtime2site.py

      - name: Build the composites page
        run: uv run converters/ui/composites2site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Only main deploys; pull requests stop after build so the coverage report
    # still runs on every PR.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
