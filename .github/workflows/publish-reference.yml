name: Publish reference files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true

permissions:
  contents: write

jobs:
  publish:
    uses: simovilab/.github/.github/workflows/publish-reference.yml@main
    with:
      tag: ${{ inputs.tag }}
      files: |
        serializers/schedule/schedule.yaml:schedule.yaml
        serializers/realtime/realtime.yaml:realtime.yaml
      python_packages: pyyaml
      validate_cmd: python -c "import yaml; [yaml.safe_load(open(p)) for p in ('serializers/schedule/schedule.yaml', 'serializers/realtime/realtime.yaml')]"
